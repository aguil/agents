# Reject invalid Conventional Commit headers (e.g. feat!(scope):) that release-please
# silently drops from versioning/changelog. See .agents/rules/conventional-commits.md.
name: commit-headers

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_EXPERIMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: mise exec --locked -- cog check --ignore-merge-commits "$BASE_SHA..$HEAD_SHA"
