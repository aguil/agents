spec_version: "0.2"
kind: harness
harness:
  id: hp-edit-deny
  description: >-
    Hook-parity live check (ADR 0028 decisions 3 and 5): an edit-scoped
    pre_tool_call handler on Cursor's preToolUse sees an in-place edit of an
    existing file, and its deny blocks the edit.
hooks:
  pre_tool_call:
    - command: python3 -I $HARNESS_DIR/../../../log-call.py pre-edit deny-cursor
      applies_to: [edit]
roles:
  solo:
    description: edits one existing file in place
    timeout_ms: 240000
    prompt: |
      The workspace holds seed.txt, whose second line is "status: original".
      Change that line to "status: changed" in place, using your file-editing
      tool, not a shell command. Change nothing else, make no other tool call,
      then reply DONE.
